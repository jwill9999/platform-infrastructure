apiVersion: 1

groups:
  - orgId: 1
    name: openrouter-credits
    folder: Alerts
    interval: 5m
    rules:
      - uid: openrouter-credits-low-1
        title: OpenRouter remaining credits low
        condition: B
        for: 5m
        noDataState: NoData
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: openrouter_credits_total_dollars - openrouter_credits_used_dollars
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [2]
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
        labels:
          severity: warning
        annotations:
          summary: OpenRouter remaining credits are below $2
          description: "Remaining credits: ${A} (threshold: $2). Top up at https://openrouter.ai/settings/credits"
        notification_settings:
          receiver: slack-alerts

  - orgId: 1
    name: claude-code-quota
    folder: Alerts
    interval: 5m
