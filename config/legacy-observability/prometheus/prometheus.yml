global:
  scrape_interval: 1m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # aperture-exporter scrape job removed 2026-11-16: container stopped (paused, not deleted),
  # superseded by openrouter-activity-exporter. Re-add if aperture-exporter is restarted.

  - job_name: openrouter-activity-exporter
    static_configs:
      - targets: ['openrouter-activity-exporter:9202']
